# Uploads the addon to CurseForge when a release is published on GitHub, with
# the release notes as its changelog, and attaches the same zip to the GitHub
# release so it can be downloaded there too (or the version's CHANGELOG.md section when
# the notes are empty). Pushes and tags alone upload nothing. See .github/scripts/curseforge.py
# (the same workflow and script are used in every Nullgate addon repository).
#
# Needs the repository secret CURSEFORGE_TOKEN (CurseForge > Authors > My API Tokens)
# and "## X-Curse-Project-ID:" in the .toc. It can also be run by hand from
# Actions > "CurseForge upload" > Run workflow, with a release's tag.
name: CurseForge upload

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the published release to upload (for example v1.3.3). Not needed for a dry run.
        required: false
      dry_run:
        description: Only check the token, project and game version with the current code, upload nothing
        type: boolean
        default: false

permissions:
  contents: write # attach the zip to the release

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - name: Changelog from the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ !inputs.dry_run }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/changelog.md"

      - name: Build the addon zip
        run: python3 .github/scripts/curseforge.py zip dist

      - uses: actions/upload-artifact@v4
        with:
          name: curseforge-zip
          path: dist/*.zip

      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ !inputs.dry_run }}
        run: gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG_FILE: ${{ runner.temp }}/changelog.md
          RELEASE_TYPE: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          CURSEFORGE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/curseforge.py upload dist/*.zip
