<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Quest Tracker - Forever: a quest list with checked objectives, a gold quest mark and a Wayfinder arrow -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e3bd"/>
      <stop offset="1" stop-color="#d9bf87"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e0a526"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="1" stop-color="#1f7fd6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <!-- quest scroll -->
  <ellipse cx="236" cy="420" rx="128" ry="14" fill="#000000" opacity="0.35"/>
  <rect x="104" y="108" width="264" height="300" rx="14" fill="url(#parchment)" stroke="#7a5a26" stroke-width="5"/>
  <rect x="92" y="96" width="288" height="28" rx="14" fill="#c9a54e" stroke="#7a5a26" stroke-width="5"/>
  <rect x="92" y="392" width="288" height="28" rx="14" fill="#c9a54e" stroke="#7a5a26" stroke-width="5"/>
  <!-- title line -->
  <rect x="132" y="146" width="150" height="16" rx="8" fill="#7a5a26" opacity="0.8"/>
  <!-- objectives: two done (green checks), one still to do -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="132" y="190" width="30" height="30" rx="6" fill="#2a3442"/>
    <path d="M139 205 l7 8 l12 -15" fill="none" stroke="#5fdc5a" stroke-width="6"/>
    <rect x="176" y="198" width="140" height="13" rx="6.5" fill="#7a5a26" opacity="0.55"/>

    <rect x="132" y="244" width="30" height="30" rx="6" fill="#2a3442"/>
    <path d="M139 259 l7 8 l12 -15" fill="none" stroke="#5fdc5a" stroke-width="6"/>
    <rect x="176" y="252" width="118" height="13" rx="6.5" fill="#7a5a26" opacity="0.55"/>

    <rect x="132" y="298" width="30" height="30" rx="6" fill="none" stroke="#2a3442" stroke-width="5"/>
    <rect x="176" y="306" width="132" height="13" rx="6.5" fill="#7a5a26" opacity="0.55"/>
  </g>

  <!-- gold quest mark (top right) -->
  <circle cx="378" cy="138" r="54" fill="#ffd25a" opacity="0.45" filter="url(#glow)"/>
  <circle cx="378" cy="138" r="46" fill="#1a1f29" stroke="url(#gold)" stroke-width="6"/>
  <rect x="368" y="104" width="20" height="46" rx="8" fill="url(#mark)"/>
  <circle cx="378" cy="166" r="10" fill="url(#mark)"/>

  <!-- Wayfinder arrow (bottom right) -->
  <circle cx="390" cy="368" r="56" fill="#4fb4ff" opacity="0.4" filter="url(#glow)"/>
  <circle cx="390" cy="368" r="48" fill="#1a1f29" stroke="#9fd6ff" stroke-width="5"/>
  <path d="M390 330 L414 390 L390 378 L366 390 Z" fill="url(#arrow)" stroke="#d7f3ff" stroke-width="3" stroke-linejoin="round" transform="rotate(35 390 368)"/>
</svg>
